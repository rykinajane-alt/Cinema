
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинотеатр — список сеансов</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #253b5b;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      color: #203e70;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .toolbar form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 0;
    }

    input[type="text"] {
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      min-width: 190px;
      font-size: 14px;
    }

    button, .button {
      display: inline-block;
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      background: #345f9e;
      color: white;
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover, .button:hover {
      background: #254e87;
    }

    .secondary {
      background: #68778d;
    }

    .secondary:hover {
      background: #526176;
    }

    .danger {
      background: #b84242;
    }

    .danger:hover {
      background: #963333;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 12px 10px;
      border: 1px solid #d5deea;
      text-align: left;
    }

    th {
      background: #eaf0f8;
      color: #203e70;
    }

    tbody tr:hover {
      background: #f7f9fc;
    }

    .empty {
      text-align: center;
      color: #64748b;
    }

    .success {
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      background: #e4f5e8;
      color: #236b36;
    }

    .count {
      margin-top: 16px;
      color: #64748b;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .actions form {
      margin: 0;
    }

    @media (max-width: 700px) {
      .container {
        padding: 16px;
        overflow-x: auto;
      }

      table {
        min-width: 750px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Кинотеатр — список сеансов</h1>

  <!-- Сообщение об успешном действии -->
  <div class="success"
       th:if="${successMessage}"
       th:text="${successMessage}">
  </div>

  <!-- Поиск, добавление, статистика, выход и сортировка -->
  <div class="toolbar">

    <!-- Поиск -->
    <form th:action="@{/sessions}" method="get">
      <input type="text"
             name="keyword"
             placeholder="Поиск по фильму или киностудии"
             th:value="${keyword}">

      <button type="submit">Найти</button>

      <a th:href="@{/sessions}"
         class="button secondary">
        Сбросить
      </a>
    </form>

    <!-- Добавление сеанса -->
    <a th:href="@{/sessions/new}" class="button">
      Добавить сеанс
    </a>

    <!-- Статистика -->
    <a th:href="@{/sessions/statistics}"
       class="button secondary">
      Статистика
    </a>

    <!-- Выход из аккаунта -->
    <form th:action="@{/logout}" method="post">
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}">

      <button type="submit" class="secondary">
        Выйти
      </button>
    </form>

    <!-- Сортировка -->
    <a th:href="@{/sessions(sortDir=${sortDir == 'asc' ? 'desc' : 'asc'}, keyword=${keyword})}"
       class="button secondary"
       th:text="${sortDir == 'asc'
                ? 'Сортировка: по убыванию'
                : 'Сортировка: по возрастанию'}">
    </a>

  </div>

  <!-- Таблица сеансов -->
  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Название фильма</th>
      <th>Киностудия</th>
      <th>Дата и время сеанса</th>
      <th>Количество билетов</th>
      <th>Действия</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="cinemaSession : ${sessions}">

      <td th:text="${cinemaSession.id}"></td>

      <td th:text="${cinemaSession.filmTitle}"></td>

      <td th:text="${cinemaSession.filmStudio}"></td>

      <td th:text="${#temporals.format(
                cinemaSession.sessionDateTime,
                'dd.MM.yyyy HH:mm')}">
      </td>

      <td th:text="${cinemaSession.ticketCount}"></td>

      <td>
        <div class="actions">

          <!-- Редактирование -->
          <a th:href="@{/sessions/edit/{id}(id=${cinemaSession.id})}"
             class="button">
            Изменить
          </a>

          <!-- Удаление -->
          <form th:action="@{/sessions/delete/{id}(id=${cinemaSession.id})}"
                method="post"
                onsubmit="return confirm('Вы действительно хотите удалить сеанс?');">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit" class="danger">
              Удалить
            </button>

          </form>

        </div>
      </td>

    </tr>

    <!-- Если сеансов нет -->
    <tr th:if="${#lists.isEmpty(sessions)}">
      <td colspan="6" class="empty">
        Сеансы не найдены
      </td>
    </tr>

    </tbody>
  </table>

  <!-- Общее количество записей в базе -->
  <div class="count">
    Общее количество записей:
    <strong th:text="${recordCount}">0</strong>
  </div>

</div>
</body>
</html>
